name: Bootstrap platform folders (T-001, temporary)

# One-time helper for T-001: the agent's container cannot download the Flutter
# SDK, so the official `flutter create` runs here and commits only the
# generated platform folders and the lockfile to the task branch.
# This file is deleted in the next commit of T-001.

on:
  push:
    branches: ["agent/platform-T-001-skeleton"]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (SP-6)
      - name: Install pinned Flutter
        run: bash tool/ci/run_logged.sh "install flutter" bash tool/ci/install_flutter.sh
      - name: Generate platform folders with the official template
        run: |
          if [ -d android ] && [ -f pubspec.lock ]; then
            echo "Already bootstrapped; nothing to do."
            exit 0
          fi
          bash tool/ci/run_logged.sh "flutter create" flutter create \
            --project-name bluehesab_mini \
            --org io.github.bluehubbot \
            --platforms android,ios,macos,windows,web \
            --no-pub .
          bash tool/ci/run_logged.sh "pub get" flutter pub get
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios macos windows web .metadata pubspec.lock
          git status --short
          git commit -m "build(T-001): generate platform folders with flutter create 3.47.8" \
            -m "Generated by .github/workflows/bootstrap-platforms.yml (official template, no edits)."
          git push origin "HEAD:${GITHUB_REF_NAME}"
