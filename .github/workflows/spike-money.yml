name: Spike T-002 money

# T-002 (SP-02, SP-05, I-01): the spike package spike/money on every desktop
# OS, on an Android emulator and an iOS simulator (device_app, platform
# folders generated here and never committed), its platform-neutral test in
# Chrome (web = formatting only, ADR-0009), analyzer, the no-float check and
# a license scan of the spike lockfile (spike/README.md §3). Pins as in
# ci.yml (SP-6).

on:
  pull_request:
    paths:
      - "spike/money/**"
      - ".github/workflows/spike-money.yml"
      - "tool/ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-money-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lockfile:
    name: lockfiles present
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24 (SP-6)
      - name: Bootstrap only - resolve and print a missing pubspec.lock
        if: hashFiles('spike/money/pubspec.lock') == '' || hashFiles('spike/money/device_app/pubspec.lock') == ''
        run: |
          bash tool/ci/run_logged.sh "install flutter" bash tool/ci/install_flutter.sh
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          for pkg in spike/money spike/money/device_app; do
            [ -f "$pkg/pubspec.lock" ] && continue
            (cd "$pkg" && flutter pub get)
            PKG="$pkg" python3 - <<'PY'
          import base64, gzip, os
          pkg = os.environ["PKG"]
          data = base64.b64encode(gzip.compress(open(f"{pkg}/pubspec.lock", "rb").read(), mtime=0)).decode()
          parts = [data[i:i + 3000] for i in range(0, len(data), 3000)]
          for n, part in enumerate(parts, 1):
              print(f"::notice title={pkg}/pubspec.lock gzip+base64 {n}/{len(parts)}::{part}")
          PY
            echo "::error title=Lockfile::$pkg/pubspec.lock is missing; commit the resolved file"
            missing=1
          done
          exit "${missing:-0}"

  analyze:
    name: analyze + no-float + license scan
    needs: lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24 (SP-6)
      - name: Install pinned Flutter
        run: bash tool/ci/run_logged.sh "install flutter" bash tool/ci/install_flutter.sh
      - name: Resolve packages from the committed lockfile
        working-directory: spike/money
        run: bash ../../tool/ci/run_logged.sh "pub get" flutter pub get --enforce-lockfile
      - name: flutter analyze (spike package)
        working-directory: spike/money
        run: bash ../../tool/ci/run_logged.sh "flutter analyze" flutter analyze
      - name: No double/num on the money path (I-01)
        working-directory: spike/money
        run: bash ../../tool/ci/run_logged.sh "no-float check" flutter test test/no_float_test.dart
      - name: License scan of the spike lockfile (CB-9, SP-11)
        run: |
          mkdir -p build/ci
          (cd spike/money && flutter pub deps --json) > build/ci/spike-deps.json
          python3 tool/ci/license_scan.py \
            --deps build/ci/spike-deps.json \
            --package-config spike/money/.dart_tool/package_config.json \
            --audit docs/research/OPEN_SOURCE_AUDIT.md \
            --report build/ci/spike-license-report.md
      - name: Publish the report in the run summary
        if: always()
        run: cat build/ci/spike-license-report.md >> "$GITHUB_STEP_SUMMARY" || true

  test:
    name: test ${{ matrix.os }}
    needs: lockfile
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24 (SP-6)
      - name: Install pinned Flutter
        run: bash tool/ci/run_logged.sh "install flutter" bash tool/ci/install_flutter.sh
      - name: Resolve packages from the committed lockfile
        working-directory: spike/money
        run: bash ../../tool/ci/run_logged.sh "pub get" flutter pub get --enforce-lockfile
      - name: flutter test (VM, real SQLite through drift)
        working-directory: spike/money
        run: bash ../../tool/ci/run_logged.sh "flutter test ${{ matrix.os }}" flutter test --reporter expanded
      - name: Evidence (OS, SQLite version)
        if: always()
        working-directory: spike/money
        run: |
          if [ -f build/spike-evidence.txt ]; then
            echo "::notice title=Evidence ${{ matrix.os }}::$(tr '\n' ' ' < build/spike-evidence.txt)"
          fi

  web:
    name: test web (Chrome, formatting only)
    needs: lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24 (SP-6)
      - name: Install pinned Flutter
        run: bash tool/ci/run_logged.sh "install flutter" bash tool/ci/install_flutter.sh
      - name: Resolve packages from the committed lockfile
        working-directory: spike/money
        run: bash ../../tool/ci/run_logged.sh "pub get" flutter pub get --enforce-lockfile
      - name: flutter test --platform chrome (core only)
        working-directory: spike/money
        run: bash ../../tool/ci/run_logged.sh "flutter test chrome" flutter test --platform chrome --reporter expanded test/core_test.dart

  android:
    name: test android (emulator)
    needs: lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24 (SP-6)
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0, node24 (SP-6)
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Flutter
        run: bash tool/ci/run_logged.sh "install flutter" bash tool/ci/install_flutter.sh
      - name: Generate platform folders (not committed) and resolve packages
        working-directory: spike/money/device_app
        run: |
          # Generated in an empty folder, then only android/ and ios/ are copied in,
          # so nothing committed is touched by the template.
          bash ../../../tool/ci/run_logged.sh "flutter create" flutter create --no-pub \
            --platforms=android,ios --org io.github.bluehubbot --project-name spike_money_device \
            "$RUNNER_TEMP/generated"
          cp -R "$RUNNER_TEMP/generated/android" "$RUNNER_TEMP/generated/ios" .
          bash ../../../tool/ci/run_logged.sh "pub get" flutter pub get --enforce-lockfile
      - name: Start an Android emulator (API 35, x86_64, KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          image="system-images;android-35;google_apis;x86_64"
          (yes || true) | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "emulator" "platform-tools" "$image" >/dev/null
          echo no | "$sdk/cmdline-tools/latest/bin/avdmanager" create avd -n spike -k "$image" --force
          nohup "$sdk/emulator/emulator" -avd spike -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          "$sdk/platform-tools/adb" wait-for-device
          for _ in $(seq 1 120); do
            [ "$("$sdk/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          echo "::notice title=Android emulator::API $("$sdk/platform-tools/adb" shell getprop ro.build.version.sdk | tr -d '\r'), Android $("$sdk/platform-tools/adb" shell getprop ro.build.version.release | tr -d '\r')"
      - name: Integration test on the emulator
        working-directory: spike/money/device_app
        run: |
          bash ../../../tool/ci/run_logged.sh "android test" \
            flutter test integration_test/money_device_test.dart -d emulator-5554 --reporter expanded \
            | tee "$RUNNER_TEMP/device.log"
      - name: Evidence (Android, SQLite version)
        if: always()
        run: |
          line="$(grep -ho 'SPIKE_EVIDENCE.*' "$RUNNER_TEMP/device.log" | head -n 1 || true)"
          [ -n "$line" ] && echo "::notice title=Evidence android::${line}" || true

  ios:
    name: test ios (simulator)
    needs: lockfile
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24 (SP-6)
      - name: Install pinned Flutter
        run: bash tool/ci/run_logged.sh "install flutter" bash tool/ci/install_flutter.sh
      - name: Generate platform folders (not committed) and resolve packages
        working-directory: spike/money/device_app
        run: |
          # Generated in an empty folder, then only android/ and ios/ are copied in,
          # so nothing committed is touched by the template.
          bash ../../../tool/ci/run_logged.sh "flutter create" flutter create --no-pub \
            --platforms=android,ios --org io.github.bluehubbot --project-name spike_money_device \
            "$RUNNER_TEMP/generated"
          cp -R "$RUNNER_TEMP/generated/android" "$RUNNER_TEMP/generated/ios" .
          bash ../../../tool/ci/run_logged.sh "pub get" flutter pub get --enforce-lockfile
      - name: Boot an iPhone simulator (newest iOS runtime)
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if ".iOS-" in k),
                            key=lambda k: [int(x) for x in k.rsplit("iOS-", 1)[1].split("-")])
          for runtime in reversed(runtimes):
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); print(runtime + " " + d["name"], file=sys.stderr); sys.exit(0)
          sys.exit("no iPhone simulator")
          ')"
          xcrun simctl boot "$udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Integration test on the simulator
        working-directory: spike/money/device_app
        run: |
          bash ../../../tool/ci/run_logged.sh "ios test" \
            flutter test integration_test/money_device_test.dart -d "$SIM_UDID" --reporter expanded \
            | tee "$RUNNER_TEMP/device.log"
      - name: Evidence (iOS, SQLite version)
        if: always()
        run: |
          line="$(grep -ho 'SPIKE_EVIDENCE.*' "$RUNNER_TEMP/device.log" | head -n 1 || true)"
          [ -n "$line" ] && echo "::notice title=Evidence ios::${line}" || true
