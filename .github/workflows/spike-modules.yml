name: Spike T-008 modules

# T-008 (SP-12, MDC-T7): the spike package spike/T-008-modules on every
# desktop OS (flutter test VM) and in Chrome, analyzer, a license scan and
# the dependency graph of the spike lockfile (spike/README.md §3), and the
# MDC-T7 job that removes the budget module from a throw-away checkout.
# No platform code, so no device jobs. Pins as in ci.yml (SP-6).

on:
  pull_request:
    paths:
      - "spike/T-008-modules/**"
      - ".github/workflows/spike-modules.yml"
      - "tool/ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-modules-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lockfile:
    name: lockfiles present
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24 (SP-6)
      - name: Bootstrap only - resolve and print a missing pubspec.lock
        if: hashFiles('spike/T-008-modules/pubspec.lock') == ''
        run: |
          bash tool/ci/run_logged.sh "install flutter" bash tool/ci/install_flutter.sh
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          for pkg in spike/T-008-modules; do
            [ -f "$pkg/pubspec.lock" ] && continue
            (cd "$pkg" && flutter pub get)
            PKG="$pkg" python3 - <<'PY'
          import base64, gzip, os
          pkg = os.environ["PKG"]
          data = base64.b64encode(gzip.compress(open(f"{pkg}/pubspec.lock", "rb").read(), mtime=0)).decode()
          parts = [data[i:i + 3000] for i in range(0, len(data), 3000)]
          for n, part in enumerate(parts, 1):
              print(f"::notice title={pkg}/pubspec.lock gzip+base64 {n}/{len(parts)}::{part}")
          PY
            echo "::error title=Lockfile::$pkg/pubspec.lock is missing; commit the resolved file"
            missing=1
          done
          exit "${missing:-0}"

  analyze:
    name: analyze + license scan
    needs: lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24 (SP-6)
      - name: Install pinned Flutter
        run: bash tool/ci/run_logged.sh "install flutter" bash tool/ci/install_flutter.sh
      - name: Resolve packages from the committed lockfile
        working-directory: spike/T-008-modules
        run: bash ../../tool/ci/run_logged.sh "pub get" flutter pub get --enforce-lockfile
      - name: flutter analyze (spike package)
        working-directory: spike/T-008-modules
        run: bash ../../tool/ci/run_logged.sh "flutter analyze" flutter analyze
      - name: License scan of the spike lockfile (CB-9, SP-11)
        run: |
          mkdir -p build/ci
          (cd spike/T-008-modules && flutter pub deps --json) > build/ci/spike-deps.json
          python3 tool/ci/license_scan.py \
            --deps build/ci/spike-deps.json \
            --package-config spike/T-008-modules/.dart_tool/package_config.json \
            --audit docs/research/OPEN_SOURCE_AUDIT.md \
            --report build/ci/spike-license-report.md
      - name: Publish the report in the run summary
        if: always()
        run: cat build/ci/spike-license-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Dependency graph (audit rows ask for the real runtime list)
        working-directory: spike/T-008-modules
        run: |
          flutter pub deps --style=compact --no-dev | tee ../../build/ci/spike-deps.txt
          { echo '```'; cat ../../build/ci/spike-deps.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test ${{ matrix.os }}
    needs: lockfile
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24 (SP-6)
      - name: Install pinned Flutter
        run: bash tool/ci/run_logged.sh "install flutter" bash tool/ci/install_flutter.sh
      - name: Resolve packages from the committed lockfile
        working-directory: spike/T-008-modules
        run: bash ../../tool/ci/run_logged.sh "pub get" flutter pub get --enforce-lockfile
      - name: flutter test (VM)
        working-directory: spike/T-008-modules
        run: bash ../../tool/ci/run_logged.sh "flutter test ${{ matrix.os }}" flutter test --reporter expanded
      - name: Evidence (OS, resolved versions)
        if: always()
        working-directory: spike/T-008-modules
        run: |
          if [ -f build/spike-evidence.txt ]; then
            echo "::notice title=Evidence ${{ matrix.os }}::$(tr '\n' ' ' < build/spike-evidence.txt)"
          fi

  web:
    name: test web (Chrome)
    needs: lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24 (SP-6)
      - name: Install pinned Flutter
        run: bash tool/ci/run_logged.sh "install flutter" bash tool/ci/install_flutter.sh
      - name: Resolve packages from the committed lockfile
        working-directory: spike/T-008-modules
        run: bash ../../tool/ci/run_logged.sh "pub get" flutter pub get --enforce-lockfile
      - name: flutter test --platform chrome (platform-neutral tests)
        working-directory: spike/T-008-modules
        run: bash ../../tool/ci/run_logged.sh "flutter test chrome" flutter test --platform chrome --reporter expanded test/registry_test.dart test/redirect_test.dart test/app_widget_test.dart test/core_test.dart

  mdc_t7:
    name: module removed (MDC-T7)
    needs: lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24 (SP-6)
      - name: Install pinned Flutter
        run: bash tool/ci/run_logged.sh "install flutter" bash tool/ci/install_flutter.sh
      - name: Remove the budget module (one line in app/module_list.dart)
        working-directory: spike/T-008-modules
        run: |
          python3 -I tool/remove_module.py budget
          git diff --stat -- lib/core
          test -z "$(git status --porcelain -- lib/core)"
      - name: Resolve packages from the committed lockfile
        working-directory: spike/T-008-modules
        run: bash ../../tool/ci/run_logged.sh "pub get" flutter pub get --enforce-lockfile
      - name: flutter analyze without the module
        working-directory: spike/T-008-modules
        run: bash ../../tool/ci/run_logged.sh "flutter analyze (MDC-T7)" flutter analyze
      - name: core tests without the module
        working-directory: spike/T-008-modules
        run: bash ../../tool/ci/run_logged.sh "flutter test (MDC-T7)" flutter test --reporter expanded
