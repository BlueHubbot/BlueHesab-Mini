# BlueHesab Mini — app package (T-001 skeleton; ADR-0009 §1, §3).
# Dependency rule (CB-9, AGENTS.md): every non-SDK dependency needs a row in
# docs/research/OPEN_SOURCE_AUDIT.md before it is added here; CI enforces it
# through tool/ci/license_scan.py. T-001 adds none.
name: bluehesab_mini
description: Persian-first, local-first personal finance app.
publish_to: none
version: 0.0.1+1

environment:
  sdk: ^3.11.0
  # Pinned Flutter SDK; single source of truth is tool/ci/flutter_version.env.
  flutter: 3.47.8

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: false
  # Fonts: none until ADR-UI-003 is accepted (ui-spec §3-1, table 12-1-a);
  # the typography tokens use `system` meanwhile. See ESC-001.
